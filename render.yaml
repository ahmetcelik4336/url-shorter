services:
  - type: web
    name: api-service
    env: host        # Render'ın otomatik Go taramasını durdurur
    plan: free
    buildCommand: go build -o api-app ./2 && cp -r ./api/conf .
    startCommand: ./api-app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshorter
          property: connectionString
      - key: GO_VERSION
        value: 1.22.0

  - type: web
    name: site-service
    env: host
    plan: free
    buildCommand: go build -o site-app ./client_
    startCommand: ./site-app
    envVars:
      - key: GO_VERSION
        value: 1.22.0
      - key: API_URL
        fromStack:
          name: api-service # Yukarıdaki servisin adıyla eşleşmeli
          property: host    # Render bu servisin iç adresini API_URL'e atar