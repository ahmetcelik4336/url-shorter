services:
  - type: web
    name: api-service
    runtime: go
    plan: free
    # Root dizinden build alırken shared paketlerini görebilmesi için:
    buildCommand: go build -o bin/api-service ./api && cp -r ./api/conf ./bin/conf || true
    startCommand: ./bin/api-service
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urldb
          property: connectionString
      - key: GO_VERSION
        value: 1.22.0

  - type: web
    name: site-service
    runtime: go
    plan: free
    # Client build komutu
    buildCommand: go build -o bin/site-service ./client_
    startCommand: ./bin/site-service
    envVars:
      - key: GO_VERSION
        value: 1.22.0
      - key: API_URL
        fromStack:
          name: api-service
          property: host