<div class="modal-header w-100" style="display: flex;justify-content: space-between;align-items: center;">
    <h5 class="modal-title">Modal title</h5>
    <span type="button" class="close btn btn-sm" data-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </span>
</div>
<form action="{{baseurl .slug .action}}" method="post">
    <div class="modal-body">
        <div class="form-group">
            <label class="text-success" for="">Url</label>
            <input type="url" name="url"  class="form-control border-success">
        </div>
        <div class="form-group">
            <span type="button" style="display: flex;justify-content: space-between;align-items: center;"
                data-toggle="collapse" data-target="#collapseExample" aria-expanded="false"
                aria-controls="collapseExample">
                <span>Enter Alias</span>
                <i class="fas fa-chevron-down"></i>
            </span>

            <div class="collapse py-2" id="collapseExample">
                <div class="form-group">
                    <input type="text" name="alias"  class="form-control">
                </div>
            </div>
        </div>

        <div class="form-group">
            <span type="button" style="display: flex;justify-content: space-between;align-items: center;"
                data-toggle="collapse" data-target="#collapseExample1" aria-expanded="false"
                aria-controls="collapseExample1">
                <span>Enter Password</span>
                <i class="fas fa-chevron-down"></i>
            </span>

            <div class="collapse py-2" id="collapseExample1">
                <div class="form-group">
                    <input type="text" name="password"  class="form-control">
                </div>
            </div>
        </div>

        <div class="form-group">
            <span type="button" style="display: flex;justify-content: space-between;align-items: center;"
                data-toggle="collapse" data-target="#collapseExample2" aria-expanded="false"
                aria-controls="collapseExample2">
                <span>Enter Expiration Date</span>
                <i class="fas fa-chevron-down"></i>
            </span>

            <div class="collapse py-2" id="collapseExample2">
                <div class="form-group">
                    <input type="datetime-local" name="expiration" placeholder="" class="form-control">
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary">Save</button>
    </div>
</form>
