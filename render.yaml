services:
  - type: web
    name: api-service
    env: go
    rootDir: api
    buildCommand: go build -o app .
    startCommand: ./app
    goVersion: 1.22
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshorter
          property: connectionString

  - type: web
    name: site-service
    env: go
    rootDir: client
    buildCommand: go build -o app .
    startCommand: ./app
    goVersion: 1.22