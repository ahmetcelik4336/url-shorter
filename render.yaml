services:
  - type: web
    name: api-service
    env: go
    plan: free
    buildCommand: cd api && go build -o app .
    startCommand: cd api && ./app
    goVersion: 1.22
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshorter
          property: connectionString

  - type: web
    name: site-service
    env: go
    rootDir: client
    plan: free
    buildCommand: cd client && go build -o app .
    startCommand: cd client && ./app
    goVersion: 1.22