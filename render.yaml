services:
  - type: web
    name: api-service
    env: go
    buildCommand: go build -o main ./apps/2/main.go
    startCommand: ./main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshorter
          property: connectionString
      - key: GO_VERSION
        value: 1.26.2

  - type: web
    name: site-service
    env: go
    buildCommand: go build -o site ./apps/client_/main.go
    startCommand: ./site