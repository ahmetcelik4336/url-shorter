services:
  - type: web
    name: api-service
    env: go
    plan: free
    # Ana dizinden komutu veriyoruz, Go otomatik go.work'ü kullanır
    buildCommand: go build -o api-app ./api
    startCommand: ./api-app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshorter
          property: connectionString

  - type: web
    name: site-service
    env: go
    plan: free
    buildCommand: go build -o site-app ./client
    startCommand: ./site-app