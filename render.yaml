services:
  - type: web
    name: api-service
    env: host  # 'go' yerine 'host' kullanarak Render'ın kısıtlamalarını aşıyoruz
    plan: free
    # Ana dizindeki go.work'ü kullanarak api klasörünü derler
    buildCommand: go build -o api-app ./2
    startCommand: ./api-app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshorter
          property: connectionString

  - type: web
    name: site-service
    env: host
    plan: free
    # Ana dizindeki go.work'ü kullanarak client klasörünü derler
    buildCommand: go build -o site-app ./client_
    startCommand: ./site-app