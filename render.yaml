services:
  - type: web
    name: api-service
    env: go
    plan: free
    # Ana dizinden api klasörüne gidip derleme yapar
    buildCommand: go build -o api-app ./2/main.go
    startCommand: ./api-app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshorter
          property: connectionString

  - type: web
    name: site-service
    env: go
    plan: free
    # Ana dizinden client klasörüne gidip derleme yapar
    buildCommand: go build -o site-app ./client_/main.go
    startCommand: ./site-app